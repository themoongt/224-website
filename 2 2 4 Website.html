
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✞ THE 224 DISCIPLES ✞</title>

<style>

/* =========================================================
   224 DISCIPLES
   DARK BLUE / BLACK WEBSITE
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
    scroll-behavior:smooth;
}

:root{
    --bg:#02050B;
    --blue:#2D7DFF;
    --blue2:#5EAFFF;
    --light:#DCEEFF;
    --panel:#060C15;
    --panel2:#091321;
    --border:#12345A;
}

body{
    background:var(--bg);
    color:var(--light);
    overflow-x:hidden;
}

/* =========================================================
   LOADING SCREEN
========================================================= */

.loader{
    position:fixed;
    inset:0;
    background:#02050B;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    transition:opacity 1s ease, visibility 1s ease;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-logo{
    font-size:4rem;
    font-weight:900;
    color:#66B5FF;
    text-shadow:
        0 0 10px #2D7DFF,
        0 0 30px #2D7DFF,
        0 0 70px #0055FF;
    animation:pulse 1.5s infinite alternate;
}

.loader-text{
    margin-top:20px;
    letter-spacing:6px;
    color:#86C8FF;
    font-size:.8rem;
}

.loader-line{
    width:180px;
    height:2px;
    margin-top:20px;
    background:#12345A;
    overflow:hidden;
}

.loader-line::after{
    content:"";
    display:block;
    width:50%;
    height:100%;
    background:#4DA6FF;
    box-shadow:0 0 15px #4DA6FF;
    animation:loading 1.2s infinite;
}

@keyframes loading{
    from{transform:translateX(-100%);}
    to{transform:translateX(300%);}
}

@keyframes pulse{
    from{
        transform:scale(1);
        opacity:.7;
    }
    to{
        transform:scale(1.06);
        opacity:1;
    }
}

/* =========================================================
   BACKGROUND
========================================================= */

.bg{
    position:fixed;
    inset:0;
    z-index:-5;

    background:
        radial-gradient(
            circle at 50% -20%,
            #0B2A59 0%,
            #061329 25%,
            #02050B 65%,
            #000000 100%
        );
}

.bg::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(45,125,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(45,125,255,.025) 1px,
            transparent 1px
        );

    background-size:50px 50px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

/* =========================================================
   PARTICLES
========================================================= */

.particle{
    position:fixed;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#4DA6FF;
    box-shadow:
        0 0 6px #4DA6FF,
        0 0 15px #2D7DFF;

    opacity:.6;
    pointer-events:none;

    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh) scale(.5);
    }

    to{
        transform:translateY(-20vh) scale(1.2);
    }
}

/* =========================================================
   NAVBAR
========================================================= */

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:75px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 8%;

    background:rgba(2,5,11,.65);
    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(45,125,255,.25);

    z-index:1000;
}

.logo{
    color:#6BB8FF;
    font-size:1.4rem;
    font-weight:900;
    letter-spacing:2px;

    text-shadow:
        0 0 10px #2D7DFF,
        0 0 25px rgba(45,125,255,.7);

    cursor:pointer;
}

.nav-links{
    display:flex;
    gap:32px;
}

.nav-links a{
    position:relative;

    color:#D6E8FF;
    text-decoration:none;

    font-size:.95rem;
    transition:.3s;
}

.nav-links a::after{
    content:"";

    position:absolute;
    left:0;
    bottom:-8px;

    width:0;
    height:2px;

    background:#4DA6FF;
    box-shadow:0 0 10px #2D7DFF;

    transition:.3s;
}

.nav-links a:hover{
    color:#65B5FF;
    text-shadow:0 0 12px #2D7DFF;
}

.nav-links a:hover::after{
    width:100%;
}

/* Mobile button */

.menu-btn{
    display:none;

    border:1px solid #1D75FF;
    background:#061329;
    color:#65B5FF;

    width:42px;
    height:42px;

    border-radius:10px;

    font-size:1.3rem;
    cursor:pointer;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:120px 25px 70px;

    position:relative;
}

.hero-content{
    max-width:950px;
    animation:heroIn 1.2s ease;
}

@keyframes heroIn{
    from{
        opacity:0;
        transform:translateY(35px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hero-symbol{
    font-size:3rem;
    color:#4DA6FF;

    text-shadow:
        0 0 15px #2D7DFF,
        0 0 45px #2D7DFF;

    margin-bottom:15px;
}

.hero h1{
    font-size:clamp(3rem,7vw,6rem);

    font-weight:900;

    color:#8CCBFF;

    letter-spacing:3px;

    text-shadow:
        0 0 10px #2D7DFF,
        0 0 30px #2D7DFF,
        0 0 70px rgba(45,125,255,.7);

    animation:titleGlow 3s infinite alternate;
}

@keyframes titleGlow{
    from{
        text-shadow:
            0 0 10px #2D7DFF,
            0 0 30px #2D7DFF;
    }

    to{
        text-shadow:
            0 0 20px #2D7DFF,
            0 0 50px #2D7DFF,
            0 0 90px rgba(45,125,255,.7);
    }
}

.hero h2{
    margin-top:20px;

    font-size:1.2rem;

    letter-spacing:9px;

    color:#79BFFF;

    text-shadow:0 0 15px #2D7DFF;
}

.hero p{
    max-width:720px;

    margin:35px auto 40px;

    color:#BFD9F5;

    line-height:1.9;

    font-size:1.05rem;
}

/* =========================================================
   BUTTONS
========================================================= */

.btns{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
}

.btn{
    position:relative;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-width:160px;

    padding:15px 30px;

    border-radius:10px;

    text-decoration:none;

    font-weight:700;

    transition:.3s;

    overflow:hidden;
}

.primary{
    color:white;

    background:
        linear-gradient(
            135deg,
            #0B3D91,
            #125DD1
        );

    border:1px solid #3C8BFF;

    box-shadow:
        0 0 15px rgba(29,117,255,.6),
        inset 0 0 15px rgba(255,255,255,.05);
}

.primary:hover{
    transform:translateY(-4px) scale(1.03);

    box-shadow:
        0 0 25px #1D75FF,
        0 0 55px rgba(29,117,255,.5);
}

.secondary{
    color:#8FC6FF;

    border:1px solid #286DCA;

    background:rgba(4,12,25,.6);
}

.secondary:hover{
    color:white;
    background:#081A35;

    transform:translateY(-4px);

    box-shadow:0 0 25px rgba(29,117,255,.3);
}

/* =========================================================
   SCROLL INDICATOR
========================================================= */

.scroll{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);

    color:#4E8FD0;

    font-size:.75rem;

    letter-spacing:4px;

    animation:scrollBounce 2s infinite;
}

@keyframes scrollBounce{
    0%,100%{transform:translate(-50%,0);}
    50%{transform:translate(-50%,8px);}
}

/* =========================================================
   SECTIONS
========================================================= */

.section{
    padding:110px 8%;
    position:relative;
}

.section-title{
    text-align:center;

    font-size:2.5rem;

    color:#78BFFF;

    margin-bottom:15px;

    text-shadow:
        0 0 15px #2D7DFF;
}

.section-subtitle{
    text-align:center;

    color:#6489AD;

    margin-bottom:55px;

    letter-spacing:3px;

    font-size:.85rem;
}

/* =========================================================
   CARDS
========================================================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(260px,1fr));

    gap:25px;

    max-width:1200px;

    margin:auto;
}

.card{
    position:relative;

    padding:32px;

    min-height:200px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            rgba(9,19,33,.92),
            rgba(4,10,19,.85)
        );

    border:1px solid #12345A;
